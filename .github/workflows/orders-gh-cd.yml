# orders-gh-cd: blue/green CD of orders-gh on GitHub Actions (generated by new-app-pipelines.sh --provider github; the GitHub
# version of deploy/pipelines/templates/app-cd.yml). App Service slot staging -> production:
#   ci -> deploy (staging) -> smoke -> swap (environment orders-gh-prod: required reviewers = Gate 2) -> bake -> rollback (bake failed)
# workflow_dispatch with rollback_only = true (the bot's rollback) only swaps production back.
#
# Repository variables (set by github-app-setup.sh): AZURE_CLIENT_ID (the pipeline identity sc-healer-<env>, which trusts
# this repository through OIDC and holds Healer.Events.Write), AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, HEALER_ENV, HEALER_UNIQ,
# HEALER_RESOURCE_GROUP, HEALER_WORKSPACE_ID, HEALER_BOT_URL, HEALER_BOT_RESOURCE. No secrets.
name: orders-gh-cd
on:
  push:
    branches: [main]
    paths: ['src/orders/**']
  workflow_dispatch:
    inputs:
      rollback_only:
        description: Rollback only (swap production back to the previous build)
        type: boolean
        default: false
      commit_sha:
        description: Commit to report to the bot (rollback runs)
        type: string
        default: ''
permissions:
  id-token: write
  contents: read
concurrency:
  group: orders-gh-cd
  cancel-in-progress: false
env:
  HEALER_APP_ID: orders-gh
  HEALER_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
  HEALER_BOT_URL: ${{ vars.HEALER_BOT_URL }}
  HEALER_BOT_RESOURCE: ${{ vars.HEALER_BOT_RESOURCE }}
  WEBAPP: app-orders-gh-${{ vars.HEALER_ENV }}-${{ vars.HEALER_UNIQ }}
  RESOURCE_GROUP: ${{ vars.HEALER_RESOURCE_GROUP }}
  BAKE_MINUTES: '20'
  BAKE_BASELINE_DAYS: '7'
  MAX_BAKE_EXCEPTIONS: '0'

jobs:
  ci:
    if: ${{ !inputs.rollback_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: { client-id: '${{ vars.AZURE_CLIENT_ID }}', tenant-id: '${{ vars.AZURE_TENANT_ID }}', subscription-id: '${{ vars.AZURE_SUBSCRIPTION_ID }}' }
      - run: .github/healer/notify.sh MainCI ci "Main CI started"
      - uses: actions/setup-node@v4
        with: { node-version: 22.x }
      - name: Build, test, package
        run: .github/healer/build.sh cd node "src/orders" "$RUNNER_TEMP/pkg" "$GITHUB_SHA" "" "" ""
      - name: Zip
        run: cd "$RUNNER_TEMP/pkg" && zip -qr "$RUNNER_TEMP/orders-gh.zip" .
      - uses: actions/upload-artifact@v4
        with: { name: drop, path: '${{ runner.temp }}/orders-gh.zip' }
      - if: success()
        run: .github/healer/notify.sh DeployingGreen ci
      - if: failure()
        run: .github/healer/notify.sh Failed ci "Build, test or package failed"

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/healer }
      - uses: actions/download-artifact@v4
        with: { name: drop, path: drop }
      - uses: azure/login@v2
        with: { client-id: '${{ vars.AZURE_CLIENT_ID }}', tenant-id: '${{ vars.AZURE_TENANT_ID }}', subscription-id: '${{ vars.AZURE_SUBSCRIPTION_ID }}' }
      - uses: azure/webapps-deploy@v3
        with: { app-name: '${{ env.WEBAPP }}', slot-name: staging, package: drop/orders-gh.zip }
      - if: success()
        run: .github/healer/notify.sh SmokeTesting deploy
      - if: failure()
        run: .github/healer/notify.sh Failed deploy "Deploy to the staging slot failed"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/healer }
      - name: Wait for /health version == commit
        run: |
          set -uo pipefail
          url="https://${WEBAPP}-staging.azurewebsites.net/health"
          for attempt in $(seq 1 30); do
            version="$(curl -sS --max-time 10 "$url" | jq -r '.version // empty' 2>/dev/null || true)"
            echo "attempt $attempt: $version"
            [ "$version" = "$GITHUB_SHA" ] && exit 0
            sleep 10
          done
          echo "::error::Staging never reported version $GITHUB_SHA"; exit 1
      - uses: azure/login@v2
        if: always()
        with: { client-id: '${{ vars.AZURE_CLIENT_ID }}', tenant-id: '${{ vars.AZURE_TENANT_ID }}', subscription-id: '${{ vars.AZURE_SUBSCRIPTION_ID }}' }
      - if: success()
        run: .github/healer/notify.sh AwaitingSwapApproval smoke "Staging healthy; waiting for the swap approval (orders-gh-prod)"
      - if: failure()
        run: .github/healer/notify.sh Failed smoke "Smoke test of the staging slot failed"

  swap:
    needs: smoke
    runs-on: ubuntu-latest
    environment: orders-gh-prod   # Gate 2: required reviewers on this environment
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/healer }
      - uses: azure/login@v2
        with: { client-id: '${{ vars.AZURE_CLIENT_ID }}', tenant-id: '${{ vars.AZURE_TENANT_ID }}', subscription-id: '${{ vars.AZURE_SUBSCRIPTION_ID }}' }
      - run: .github/healer/notify.sh Swapping swap
      - name: Swap staging -> production
        run: az webapp deployment slot swap -g "$RESOURCE_GROUP" -n "$WEBAPP" --slot staging --target-slot production
      - if: success()
        run: .github/healer/notify.sh Baking swap
      - if: failure()
        run: .github/healer/notify.sh Failed swap "Swap failed"

  bake:
    needs: swap
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/healer }
      - uses: azure/login@v2
        with: { client-id: '${{ vars.AZURE_CLIENT_ID }}', tenant-id: '${{ vars.AZURE_TENANT_ID }}', subscription-id: '${{ vars.AZURE_SUBSCRIPTION_ID }}' }
      - name: Read the app's bake settings
        id: cfg
        run: |
          set -uo pipefail
          minutes="$BAKE_MINUTES"; skip=false
          token="$(az account get-access-token --resource "$HEALER_BOT_RESOURCE" --query accessToken -o tsv)"
          if body="$(curl -fsS --retry 3 --max-time 30 -H "Authorization: Bearer ${token}" "${HEALER_BOT_URL%/}/api/pipeline-config/${HEALER_APP_ID}")"; then
            m="$(jq -r '.bakeMinutes // empty' <<<"$body")"; s="$(jq -r '.skipBake // false' <<<"$body")"
            [[ "$m" =~ ^[0-9]+$ ]] && [ "$m" -ge 1 ] && minutes="$m"
            [ "$s" = true ] && skip=true
          else
            echo "::warning::Could not read the app's bake settings; baking ${minutes} minutes"
          fi
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"; echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.skip == 'true'
        run: .github/healer/notify.sh Done bake "Bake skipped by the application's settings; no automatic rollback"
      - name: Bake
        if: steps.cfg.outputs.skip != 'true'
        run: sleep $(( ${{ steps.cfg.outputs.minutes }} * 60 ))
      # Sign in again: the GitHub OIDC assertion of the first login is valid for 5 minutes only, and the Azure CLI
      # can't renew it after a bake longer than that (AADSTS700024).
      - uses: azure/login@v2
        if: steps.cfg.outputs.skip != 'true'
        with: { client-id: '${{ vars.AZURE_CLIENT_ID }}', tenant-id: '${{ vars.AZURE_TENANT_ID }}', subscription-id: '${{ vars.AZURE_SUBSCRIPTION_ID }}' }
      - name: Check production exceptions for this commit
        if: steps.cfg.outputs.skip != 'true'
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt >/dev/null
          days="$BAKE_BASELINE_DAYS"
          query="let role = '${WEBAPP}'; let sha = '${GITHUB_SHA}';
          let current = AppExceptions | where TimeGenerated > ago(1d) and AppRoleName == role
            | where tostring(Properties.CommitSha) == sha and tostring(Properties.Slot) == 'production'
            | summarize Count = count() by Signature = strcat(ExceptionType, ' @ ', OuterMethod);
          let known = AppExceptions | where TimeGenerated > ago(${days}d) and AppRoleName == role
            | where tostring(Properties.CommitSha) != sha | distinct KnownSignature = strcat(ExceptionType, ' @ ', OuterMethod);
          current | join kind=leftouter known on \$left.Signature == \$right.KnownSignature | project Signature, Count, Known = isnotempty(KnownSignature)"
          result="$(az monitor log-analytics query --workspace "${{ vars.HEALER_WORKSPACE_ID }}" --analytics-query "$query" --timespan "P${days}D" -o json)"
          isknown='(.Known == true or .Known == "True" or .Known == "true")'
          count="$(jq -r "[.[] | select(($isknown) | not) | .Count | tonumber] | add // 0" <<<"$result")"
          echo "Production exceptions with new signatures for ${GITHUB_SHA}: ${count} (threshold ${MAX_BAKE_EXCEPTIONS})"
          [ "$count" -le "$MAX_BAKE_EXCEPTIONS" ] || { echo "::error::New exceptions in production; rolling back"; exit 1; }
      - if: success() && steps.cfg.outputs.skip != 'true'
        run: .github/healer/notify.sh Done bake
      - if: failure()
        run: .github/healer/notify.sh RollingBack bake "New exceptions in production during the bake"

  rollback:
    needs: bake
    if: ${{ always() && (inputs.rollback_only || needs.bake.result == 'failure') }}
    runs-on: ubuntu-latest   # not on orders-gh-prod: a rollback never waits for a second approval
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/healer }
      - uses: azure/login@v2
        with: { client-id: '${{ vars.AZURE_CLIENT_ID }}', tenant-id: '${{ vars.AZURE_TENANT_ID }}', subscription-id: '${{ vars.AZURE_SUBSCRIPTION_ID }}' }
      - if: inputs.rollback_only
        run: .github/healer/notify.sh RollingBack rollback "Rollback requested"
      - name: Swap production <-> staging (restore the previous build)
        run: az webapp deployment slot swap -g "$RESOURCE_GROUP" -n "$WEBAPP" --slot staging --target-slot production
      - if: success()
        run: .github/healer/notify.sh RolledBack rollback
      - if: failure()
        run: .github/healer/notify.sh Failed rollback "Rollback swap failed"
