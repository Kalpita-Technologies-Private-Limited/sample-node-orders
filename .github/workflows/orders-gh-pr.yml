# orders-gh-pr: build validation of pull requests for orders-gh (generated by new-app-pipelines.sh --provider github).
# Make it a required status check in the branch protection of main ("build").
name: orders-gh-pr
on:
  pull_request:
    branches: [main]
    paths: ['src/orders/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.x }
      - name: Build and test
        run: .github/healer/build.sh pr node "src/orders" "$RUNNER_TEMP/out" "$GITHUB_SHA" ""
