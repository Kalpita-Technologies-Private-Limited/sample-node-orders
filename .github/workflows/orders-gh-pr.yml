# orders-gh-pr: build validation of pull requests for orders-gh (generated by new-app-pipelines.sh --provider github).
# Make it a required status check in the branch protection of main ("build"). The workflow runs on every pull
# request (a paths filter would leave the required check missing, so pull requests outside the app could never merge);
# it builds only when the app folder or .github changed and otherwise passes at once.
name: orders-gh-pr
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Changes in the app
        id: changes
        run: |
          base="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          if git diff --quiet "$base" HEAD -- ':(glob)src/orders/**' .github; then
            echo "No changes under src/orders/** or .github: nothing to build"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22.x }
      - name: Build and test
        if: steps.changes.outputs.build == 'true'
        run: .github/healer/build.sh pr node "src/orders" "$RUNNER_TEMP/out" "$GITHUB_SHA" ""
